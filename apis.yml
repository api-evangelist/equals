apis:
- name: Equals MCP Server
  description: >-
    Hosted, remote Model Context Protocol server that gives AI assistants direct access to an Equals workspace
    — search and list workbooks including team-trusted analyses, list connected datasources and explore
    their schemas, execute SQL directly, and ask the Equals agent natural-language questions across every
    accessible datasource and workbook. Authenticated with OAuth 2.1 (authorization code + PKCE, dynamic
    client registration); documented for Claude, Claude Code, ChatGPT, Codex, Cursor, Windsurf and Zed.
    Calls consume Equals AI credits.
  humanURL: https://docs.equals.com/docs/equals-mcp
