compliance:
  published: true
  page: https://docs.equals.com/docs/faq
  certifications:
    - name: SOC 2 Type II
      status: certified
      source: https://docs.equals.com/docs/faq
  practices:
    - Regular penetration testing (cadence not published).
    - All sensitive datasource credentials (passwords, SSH keys, connection strings, OAuth tokens) stored encrypted, with the key accessible only to the necessary production servers.
    - Customer data segregated with unique credentials per datasource, per customer.
    - Subprocessor Fivetran used for non-SQL connectors; in-transit data purged typically within 8 hours.
  trust_center: false
  note: >-
    Equals states SOC 2 Type II certification in its docs FAQ but publishes no trust center, no
    certification portal, and no report-request flow; trust.equals.com and security.equals.com do not
    resolve.
