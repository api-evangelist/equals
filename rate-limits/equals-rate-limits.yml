note: >-
  Equals publishes no rate limits for either programmatic surface. The Memories API reference documents
  four error statuses (401/403/404/422) and no 429. A live unauthenticated request to
  https://go.equals.com/api/v1/memories returned 401 with no RateLimit-*, X-RateLimit-* or Retry-After
  headers, and a live unauthenticated tools/list against https://go.equals.com/api/mcp returned 401 with
  none either. An agent therefore has no runtime signal to pace against and must self-throttle.
