note: >-
  Equals' standards posture is strongest on the agent side: the hosted MCP server is fronted by a
  genuinely modern OAuth 2.1 stack with RFC 8414 and RFC 9728 discovery documents and dynamic client
  registration, and the docs host serves an A2A agent card, an Agent Skill and an llms.txt. The REST
  side is thin by comparison — a bare error envelope, no problem+json, no pagination, no idempotency.
