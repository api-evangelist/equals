source: mcp/equals-mcp.yml + openapi/equals-memories-openapi.yml
note: >-
  Equals' MCP surface and its REST surface are almost completely disjoint — this is the finding, not a
  gap to paper over. MCP exposes reading and analysis (workbooks, datasource SQL, natural-language
  questions); REST exposes exactly one thing MCP does not (the analyst's memory store). Not a single
  MCP capability has a backing public REST operation, and the one REST resource has no tool. An agent
  that wants both must hold two credentials: an OAuth token for MCP and a bearer API token for REST.
