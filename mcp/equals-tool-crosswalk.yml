mcp_only:
  - tool: workbook_discovery
    reason: >-
      No public REST operation lists or searches workbooks. Workbooks are reachable only through the
      product UI and the MCP server.
    confidence: high
  - tool: datasource_querying
    reason: >-
      No public REST operation lists datasources, reads schemas, or executes SQL. This is the largest
      REST gap: the entire query surface is MCP- and UI-only.
    confidence: high
  - tool: natural_language_analysis
    reason: >-
      "Ask Equals" is a server-side composite — it plans, queries multiple datasources, reads workbooks
      and can materialize a new workbook. It has no REST equivalent and consumes AI credits.
    confidence: high
rest_only:
  - capability: Analyst memory management
    operations: [listMemories, getMemory, createMemory, updateMemory, deleteMemory]
    reason: >-
      Memories are the context the Equals analyst applies to every answer, but no MCP tool reads or
      writes them. An agent connected over MCP can be steered by memories it cannot see or set; only the
      REST token can do that.
    confidence: high
    note: >-
      This is the sharpest divergence in the crosswalk — the write surface that shapes agent behaviour
      sits on the opposite side of the fence from the agent surface itself.
