  note: >-
    Corrected from a derived "self-serve" reading. Equals lists prices publicly ($24k/$36k/$60k per
    year) but every tier converts through a "Get a demo" button; there is no self-serve checkout and no
    signup route — equals.com/signup, go.equals.com/signup and go.equals.com/users/sign_up all 404, and
    go.equals.com/ is the application sign-in. API credentials therefore require an existing paid
    workspace: the Memories API token is minted in Settings, and the MCP server requires MCP enabled on
    the workspace.
