    The hosted MCP server returns JSON-RPC errors, not this envelope. An unauthenticated tools/list
    returns {"jsonrpc":"2.0","id":null,"error":{"code":-32000,"message":"Unauthorized"}} with HTTP 401
    and a WWW-Authenticate header pointing at the RFC 9728 protected-resource document.
  evidence:
    url: https://go.equals.com/api/mcp
    status: 401
    checked: '2026-08-14'
